plugins {
    id 'com.android.application'
}

android {
    namespace 'com.piphunter.ai'
    compileSdk 35

    defaultConfig {
        applicationId 'com.piphunter.ai'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'

        buildConfigField "String", "FINNHUB_API_KEY",
                "\"${System.getenv('FINNHUB_API_KEY') ?: ''}\""
    }

    buildFeatures {
        buildConfig true
    }
}